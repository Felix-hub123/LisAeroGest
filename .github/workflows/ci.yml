
name: LisAeroGest CI

on:
  push:
    branches:
      - main
      - feature/flight-integration
      - experiment/ci-failure
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore LisAeroGest.Tests/LisAeroGest.Tests.csproj

      - name: Build
        run: dotnet build LisAeroGest.Tests/LisAeroGest.Tests.csproj -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test LisAeroGest.Tests/LisAeroGest.Tests.csproj -c Release --no-build