services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    volumes:
      - sql_data:/var/opt/mssql

  lisaerogest:
    build:
      context: .
      dockerfile: Dockerfile
    image: lisaerogest:local-test
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${LISAEROGEST_DOCKER_CONNECTION:?Define a ligacao de teste}"
      Jwt__Key: "${LISAEROGEST_TEST_JWT:?Define a chave JWT de teste}"
      Features__EnableDatabaseSeed: "false"
      Features__EnableBackgroundServices: "false"
    depends_on:
      - sqlserver

volumes:
  sql_data: